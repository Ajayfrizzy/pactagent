apiVersion: v1
kind: Namespace
metadata:
  name: pactagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pactagent-config
  namespace: pactagent
data:
  NODE_ENV: production
  ENABLE_LEGACY_PRODUCT_API: "false"
  REQUIRE_WORKER_READY: "true"
  REQUIRE_SETTLEMENT_READY: "true"
  RATE_LIMIT_FAIL_CLOSED: "true"
  WORKER_CONCURRENCY: "4"
  JOB_LEASE_MS: "60000"
  JOB_TIMEOUT_MS: "300000"
  SHUTDOWN_TIMEOUT_MS: "30000"
  WORKER_HEARTBEAT_STALE_MS: "30000"
  PORT: "4000"
  WORKER_HEALTH_PORT: "4001"
  WS_MAX_CONNECTIONS: "1000"
  WS_MAX_CONNECTIONS_PER_IP: "20"
  WS_MAX_PAYLOAD_BYTES: "65536"
  WS_MAX_BUFFERED_BYTES: "1048576"
