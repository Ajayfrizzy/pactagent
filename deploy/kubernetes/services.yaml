apiVersion: v1
kind: Service
metadata:
  name: pactagent-api
  namespace: pactagent
spec:
  selector:
    app.kubernetes.io/name: pactagent-api
  ports:
    - name: http
      port: 4000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: pactagent-web
  namespace: pactagent
spec:
  selector:
    app.kubernetes.io/name: pactagent-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: pactagent-worker-webhook
  namespace: pactagent
spec:
  selector: { app.kubernetes.io/name: pactagent-worker-webhook }
  ports: [{ name: health, port: 4001, targetPort: health }]
