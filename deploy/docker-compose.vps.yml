name: pactagent

x-server-environment: &server-environment
  NODE_ENV: ${NODE_ENV:-production}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  DIRECT_URL: ${DIRECT_URL:?Set DIRECT_URL in .env}
  REDIS_URL: redis://redis:6379
  SERVICE_ROLE: api
  PORT: 4000
  AUTH_JWT_KEYRING_FILE: /run/secrets/jwt_keyring
  AUTH_JWT_ACTIVE_KID: ${AUTH_JWT_ACTIVE_KID:?Set AUTH_JWT_ACTIVE_KID}
  WEBHOOK_ENCRYPTION_KEYRING_FILE: /run/secrets/webhook_keyring
  WEBHOOK_ACTIVE_KEY_ID: ${WEBHOOK_ACTIVE_KEY_ID:?Set WEBHOOK_ACTIVE_KEY_ID}
  METRICS_BEARER_TOKEN_FILE: /run/secrets/metrics_bearer_token
  ADMIN_ADDRESSES: ${ADMIN_ADDRESSES:?Set ADMIN_ADDRESSES}
  CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN}
  TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
  CKB_RAIL_ENABLED: ${CKB_RAIL_ENABLED:-false}
  CKB_MAINNET_ENABLED: ${CKB_MAINNET_ENABLED:-false}
  CKB_NODE_URL: ${CKB_NODE_URL:-https://testnet.ckb.dev/}
  CKB_INDEXER_URL: ${CKB_INDEXER_URL:-https://testnet.ckb.dev/indexer}
  CKB_NETWORK: ${CKB_NETWORK:-testnet}
  BUILD_VERSION: ${PACTAGENT_RELEASE_SHA:-unknown}
  BUILD_COMMIT: ${PACTAGENT_RELEASE_SHA:-unknown}

services:
  migrate:
    image: ${PACTAGENT_MIGRATE_IMAGE:?Set PACTAGENT_MIGRATE_IMAGE in release.env}
    environment: *server-environment
    secrets: [jwt_keyring, webhook_keyring, metrics_bearer_token]
    restart: "no"

  api:
    image: ${PACTAGENT_SERVER_IMAGE:?Set PACTAGENT_SERVER_IMAGE in release.env}
    environment: *server-environment
    secrets: [jwt_keyring, webhook_keyring, metrics_bearer_token]
    ports: ["127.0.0.1:4000:4000"]
    depends_on: { redis: { condition: service_healthy } }
    init: true
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  worker:
    image: ${PACTAGENT_SERVER_IMAGE:?Set PACTAGENT_SERVER_IMAGE in release.env}
    command: ["node", "dist/worker/index.js"]
    environment:
      <<: *server-environment
      SERVICE_ROLE: worker
      OTEL_SERVICE_NAME: pactagent-worker-infrastructure
      WORKER_ID: ${WORKER_ID:-infrastructure-worker}
      WORKER_QUEUES: ${WORKER_QUEUES:-webhook,settlement}
      WORKER_HEALTH_PORT: 4001
    secrets: [webhook_keyring]
    init: true
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 5

  web:
    image: ${PACTAGENT_WEB_IMAGE:?Set PACTAGENT_WEB_IMAGE in release.env}
    environment: { API_PROXY_TARGET: http://api:4000 }
    ports: ["127.0.0.1:3000:3000"]
    depends_on: { api: { condition: service_healthy } }
    init: true
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 5

  redis:
    image: redis:7.4.0-alpine@sha256:c35af3bbcef51a62c8bae5a9a563c6f1b60d7ebaea4cb5a3ccbcc157580ae098
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    expose: ["6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 3s, retries: 5 }
    restart: unless-stopped

secrets:
  jwt_keyring: { file: "${AUTH_JWT_KEYRING_SOURCE:?Set AUTH_JWT_KEYRING_SOURCE in .env}" }
  webhook_keyring: { file: "${WEBHOOK_KEYRING_SOURCE:?Set WEBHOOK_KEYRING_SOURCE in .env}" }
  metrics_bearer_token: { file: "${METRICS_BEARER_TOKEN_SOURCE:?Set METRICS_BEARER_TOKEN_SOURCE in .env}" }
