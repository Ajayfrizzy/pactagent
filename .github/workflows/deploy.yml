name: Deploy To VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 30s
          command_timeout: 20m

          script: |
            set -e

            git config --global --add safe.directory /home/pactagent

            cd /home/pactagent

            git fetch origin
            git reset --hard origin/main

            cd server
            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm run build
            pm2 restart pactagent-server || pm2 start dist/index.js --name pactagent-server

            cd ../web
            npm ci
            npm run build
            pm2 restart pactagent-web || pm2 start npm --name pactagent-web -- start

            pm2 save
