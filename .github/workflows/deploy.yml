name: Deploy To VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # Fix Git safe directory issue
            git config --global --add safe.directory /root/pactagent

            # Go to project directory
            cd /root/pactagent

            # Pull latest code
            git fetch origin
            git reset --hard origin/main

            # ---- SERVER ----
            cd server
            npm install
            npx prisma generate
            npm run build
            pm2 restart pactagent-server || pm2 start dist/index.js --name pactagent-server

            # ---- WEB ----
            cd ../web
            npm install
            npm run build
            pm2 restart pactagent-web || pm2 start npm --name pactagent-web -- start

            # Save PM2 process list
            pm2 save