name: Build and deploy immutable release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-24.04

    outputs:
      server: ${{ steps.refs.outputs.server }}
      migrate: ${{ steps.refs.outputs.migrate }}
      web: ${{ steps.refs.outputs.web }}

    steps:
      # This IS your checkout step
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      # GHCR requires repository/image paths to be lowercase.
      - name: Configure image names
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          echo "SERVER_IMAGE=${REGISTRY}/${OWNER}/pactagent-server" >> "$GITHUB_ENV"
          echo "MIGRATE_IMAGE=${REGISTRY}/${OWNER}/pactagent-migrate" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${REGISTRY}/${OWNER}/pactagent-web" >> "$GITHUB_ENV"

      - name: Verify release configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Release SHA: ${RELEASE_SHA}"
          echo "Server image: ${SERVER_IMAGE}"
          echo "Migrate image: ${MIGRATE_IMAGE}"
          echo "Web image: ${WEB_IMAGE}"

      - id: buildx
        name: Set up Docker Buildx
        continue-on-error: true
        uses: docker/setup-buildx-action@v4

      - name: Retry Docker Buildx setup
        if: steps.buildx.outcome == 'failure'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: server
        name: Build and publish server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.SERVER_IMAGE }}:sha-${{ env.RELEASE_SHA }}
          build-args: |
            BUILD_COMMIT=${{ env.RELEASE_SHA }}
            BUILD_VERSION=${{ env.RELEASE_SHA }}

      - id: migrate
        name: Build and publish migration image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          target: migrate
          push: true
          tags: ${{ env.MIGRATE_IMAGE }}:sha-${{ env.RELEASE_SHA }}
          build-args: |
            BUILD_COMMIT=${{ env.RELEASE_SHA }}
            BUILD_VERSION=${{ env.RELEASE_SHA }}

      - id: web
        name: Build and publish web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.WEB_IMAGE }}:sha-${{ env.RELEASE_SHA }}
          build-args: |
            BUILD_COMMIT=${{ env.RELEASE_SHA }}
            BUILD_VERSION=${{ env.RELEASE_SHA }}

      - id: refs
        name: Record immutable image references
        shell: bash
        env:
          SERVER_DIGEST: ${{ steps.server.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.migrate.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        run: |
          set -euo pipefail

          if [ -z "$SERVER_DIGEST" ]; then
            echo "Server image digest is missing."
            exit 1
          fi

          if [ -z "$MIGRATE_DIGEST" ]; then
            echo "Migration image digest is missing."
            exit 1
          fi

          if [ -z "$WEB_DIGEST" ]; then
            echo "Web image digest is missing."
            exit 1
          fi

          echo "server=${SERVER_IMAGE}@${SERVER_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "migrate=${MIGRATE_IMAGE}@${MIGRATE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "web=${WEB_IMAGE}@${WEB_DIGEST}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: publish
    runs-on: ubuntu-24.04

    environment: ${{ inputs.environment || 'staging' }}

    env:
      NAMESPACE: pactagent
      SERVER_REF: ${{ needs.publish.outputs.server }}
      MIGRATE_REF: ${{ needs.publish.outputs.migrate }}
      WEB_REF: ${{ needs.publish.outputs.web }}

    steps:
      - name: Validate deployment environment
        shell: bash
        env:
          DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment || 'staging' }}
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
          SMOKE_WEB_URL: ${{ vars.SMOKE_WEB_URL }}
        run: |
          set -euo pipefail

          missing=0

          require_setting() {
            local name="$1"
            local value="$2"

            if [ -z "$value" ]; then
              echo "::error title=Missing deployment setting::Add ${name} to the '${DEPLOYMENT_ENVIRONMENT}' GitHub environment at ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/settings/environments."
              missing=1
            fi
          }

          require_setting KUBECONFIG_B64 "$KUBECONFIG_B64"
          require_setting SMOKE_API_URL "$SMOKE_API_URL"
          require_setting SMOKE_WEB_URL "$SMOKE_WEB_URL"

          if [ "$DEPLOYMENT_ENVIRONMENT" = staging ]; then
            require_setting SMOKE_API_KEY "$SMOKE_API_KEY"
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # Second checkout step
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deployment dependencies
        run: npm ci --ignore-scripts

      - name: Validate deployment configuration
        run: npm run deploy:check

      - name: Configure cluster access
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.kube"

          if ! printf '%s' "$KUBECONFIG_B64" |
            base64 --decode > "$HOME/.kube/config"
          then
            echo "::error title=Invalid deployment secret::KUBECONFIG_B64 is not valid base64."
            exit 1
          fi

          chmod 600 "$HOME/.kube/config"

          if ! kubectl config view --kubeconfig "$HOME/.kube/config" > /dev/null
          then
            echo "::error title=Invalid deployment secret::KUBECONFIG_B64 does not decode to a valid kubeconfig."
            exit 1
          fi

      - name: Verify cluster access
        run: |
          kubectl cluster-info
          kubectl get namespace "$NAMESPACE"

      - name: Apply configuration and services
        run: |
          kubectl apply \
            -f deploy/kubernetes/platform.yaml \
            -f deploy/kubernetes/services.yaml

      - name: Run migrations once
        shell: bash
        run: |
          set -euo pipefail

          kubectl \
            -n "$NAMESPACE" \
            delete job pactagent-migrate \
            --ignore-not-found

          sed \
            "s|IMAGE_MIGRATE|${MIGRATE_REF}|g" \
            deploy/kubernetes/migration-job.yaml |
            kubectl apply -f -

          if ! kubectl \
            -n "$NAMESPACE" \
            wait \
            --for=condition=complete \
            job/pactagent-migrate \
            --timeout=10m
          then
            echo "Migration job failed or timed out."

            kubectl \
              -n "$NAMESPACE" \
              describe job pactagent-migrate || true

            kubectl \
              -n "$NAMESPACE" \
              logs job/pactagent-migrate || true

            exit 1
          fi

      - name: Apply application workloads
        shell: bash
        run: |
          set -euo pipefail

          sed \
            -e "s|IMAGE_SERVER|${SERVER_REF}|g" \
            -e "s|IMAGE_WEB|${WEB_REF}|g" \
            deploy/kubernetes/workloads.yaml |
            kubectl apply -f -

      - name: Health-gated rollout and smoke checks
        id: promote
        env:
          SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
          SMOKE_WEB_URL: ${{ vars.SMOKE_WEB_URL }}
          SMOKE_METRICS_TOKEN: ${{ secrets.SMOKE_METRICS_TOKEN }}
          EXPECTED_COMMIT: ${{ env.RELEASE_SHA }}
        run: |
          set -euo pipefail

          for deployment in \
            pactagent-api \
            pactagent-worker-webhook \
            pactagent-web
          do
            kubectl \
              -n "$NAMESPACE" \
              rollout status \
              "deployment/$deployment" \
              --timeout=8m
          done

          node scripts/deployment-smoke.mjs

      - name: Validate staging performance thresholds
        id: load
        if: ${{ (inputs.environment || 'staging') == 'staging' }}
        env:
          BASE_URL: ${{ vars.SMOKE_API_URL }}
          API_KEY: ${{ secrets.SMOKE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$BASE_URL" ]; then
            echo "SMOKE_API_URL is not configured."
            exit 1
          fi

          if [ -z "$API_KEY" ]; then
            echo "SMOKE_API_KEY is not configured."
            exit 1
          fi

          for profile in api queue webhooks
          do
            echo "Running load profile: $profile"

            docker run \
              --rm \
              -i \
              -e BASE_URL \
              -e API_KEY \
              grafana/k6:0.54.0 \
              run - < "test/load/${profile}.js"
          done

      - name: Roll back application workloads on failed promotion
        if: >
          failure() &&
          (
            steps.promote.outcome == 'failure' ||
            steps.load.outcome == 'failure'
          )
        shell: bash
        run: |
          for deployment in \
            pactagent-api \
            pactagent-worker-webhook \
            pactagent-web
          do
            kubectl \
              -n "$NAMESPACE" \
              rollout undo \
              "deployment/$deployment" || true

            kubectl \
              -n "$NAMESPACE" \
              rollout status \
              "deployment/$deployment" \
              --timeout=8m || true
          done

      - name: Record immutable release
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          kubectl \
            -n "$NAMESPACE" \
            annotate deployments \
            --all \
            --overwrite \
            pactagent.dev/release-commit="$RELEASE_SHA" \
            pactagent.dev/server-image="$SERVER_REF" \
            pactagent.dev/web-image="$WEB_REF"
