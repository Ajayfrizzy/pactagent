name: Deploy To VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          script: |
            set -e
            cd ~/apps/pactagent

            git fetch origin
            git reset --hard origin/main

            cd ~/apps/pactagent/server
            npm install
            npx prisma generate
            npm run build
            pm2 restart pactagent-server

            cd ~/apps/pactagent/web
            npm install
            npm run build
            pm2 restart pactagent-web

            pm2 save
