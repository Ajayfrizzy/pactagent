name: Deploy To VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            git config --global --add safe.directory /home/pactagent

            cd /home/pactagent/pactagent

            git fetch origin
            git reset --hard origin/main

            cd server
            npm install
            npx prisma generate
            npm run build
            pm2 restart pactagent-server || pm2 start dist/index.js --name pactagent-server

            cd ../web
            npm install
            npm run build
            pm2 restart pactagent-web || pm2 start npm --name pactagent-web -- start

            pm2 save
            cd ../web
            npm install
            npm run build
            pm2 restart pactagent-web || pm2 start npm --name pactagent-web -- start

            # Save PM2 process list
            pm2 save