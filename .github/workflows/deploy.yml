name: Build and deploy immutable release
on:
  workflow_run:
    workflows: [CI]
    branches: [staging]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options: [staging, production]
        default: staging
        required: true
concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false
permissions: { contents: read, packages: write }
env:
  REGISTRY: ghcr.io
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.refs.outputs.server }}
      migrate: ${{ steps.refs.outputs.migrate }}
      web: ${{ steps.refs.outputs.web }}
    steps:
      - uses: actions/checkout@v6
        with: { ref: '${{ env.RELEASE_SHA }}' }
      - name: Configure image names
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "SERVER_IMAGE=${REGISTRY}/${owner}/pactagent-server" >> "$GITHUB_ENV"
          echo "MIGRATE_IMAGE=${REGISTRY}/${owner}/pactagent-migrate" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=${REGISTRY}/${owner}/pactagent-web" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Build server image
        id: server
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          target: runtime
          push: true
          tags: '${{ env.SERVER_IMAGE }}:sha-${{ env.RELEASE_SHA }}'
          build-args: |
            BUILD_COMMIT=${{ env.RELEASE_SHA }}
            BUILD_VERSION=${{ env.RELEASE_SHA }}
      - name: Build migration image
        id: migrate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          target: migrate
          push: true
          tags: '${{ env.MIGRATE_IMAGE }}:sha-${{ env.RELEASE_SHA }}'
          build-args: |
            BUILD_COMMIT=${{ env.RELEASE_SHA }}
            BUILD_VERSION=${{ env.RELEASE_SHA }}
      - name: Build web image
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          target: runtime
          push: true
          tags: '${{ env.WEB_IMAGE }}:sha-${{ env.RELEASE_SHA }}'
          build-args: |
            BUILD_COMMIT=${{ env.RELEASE_SHA }}
            BUILD_VERSION=${{ env.RELEASE_SHA }}
      - id: refs
        name: Record immutable image references
        env: { SERVER_DIGEST: '${{ steps.server.outputs.digest }}', MIGRATE_DIGEST: '${{ steps.migrate.outputs.digest }}', WEB_DIGEST: '${{ steps.web.outputs.digest }}' }
        run: |
          set -euo pipefail
          test -n "$SERVER_DIGEST" && test -n "$MIGRATE_DIGEST" && test -n "$WEB_DIGEST"
          echo "server=${SERVER_IMAGE}@${SERVER_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "migrate=${MIGRATE_IMAGE}@${MIGRATE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "web=${WEB_IMAGE}@${WEB_DIGEST}" >> "$GITHUB_OUTPUT"
  deploy:
    needs: publish
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'staging'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment || 'staging' }}
    env:
      DEPLOYMENT_ENVIRONMENT: ${{ inputs.environment || 'staging' }}
      SERVER_REF: ${{ needs.publish.outputs.server }}
      MIGRATE_REF: ${{ needs.publish.outputs.migrate }}
      WEB_REF: ${{ needs.publish.outputs.web }}
    steps:
      - uses: actions/checkout@v6
        with: { ref: '${{ env.RELEASE_SHA }}' }
      - name: Validate deployment settings
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          SMOKE_API_URL: ${{ vars.SMOKE_API_URL }}
          SMOKE_WEB_URL: ${{ vars.SMOKE_WEB_URL }}
          SMOKE_API_KEY: ${{ secrets.SMOKE_API_KEY }}
        run: |
          set -euo pipefail
          for value in VPS_HOST VPS_USER VPS_SSH_PRIVATE_KEY SMOKE_API_URL SMOKE_WEB_URL; do [[ -n "${!value}" ]] || { echo "Missing $value"; exit 1; }; done
          [[ "$DEPLOYMENT_ENVIRONMENT" != staging || -n "$SMOKE_API_KEY" ]] || { echo "Missing SMOKE_API_KEY"; exit 1; }
      - name: Install SSH key
        env: { VPS_SSH_PRIVATE_KEY: '${{ secrets.VPS_SSH_PRIVATE_KEY }}' }
        run: |
          set -euo pipefail; umask 077
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/pactagent.key"
          ssh-keyscan -p "${{ secrets.VPS_SSH_PORT || 22 }}" "${{ secrets.VPS_HOST }}" >> "$RUNNER_TEMP/known_hosts"
      - name: Copy deployment assets
        run: |
          set -euo pipefail; port="${{ secrets.VPS_SSH_PORT || 22 }}"; host="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"; dir="/opt/pactagent/${DEPLOYMENT_ENVIRONMENT}"
          ssh -i "$RUNNER_TEMP/pactagent.key" -p "$port" -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" "$host" "mkdir -p $dir"
          scp -i "$RUNNER_TEMP/pactagent.key" -P "$port" -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" deploy/docker-compose.vps.yml deploy/scripts/deploy-vps.sh deploy/scripts/rollback-vps.sh "$host:$dir/"
          ssh -i "$RUNNER_TEMP/pactagent.key" -p "$port" -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" "$host" "chmod 700 $dir/deploy-vps.sh $dir/rollback-vps.sh"
      - name: Deploy over SSH
        env: { VPS_HOST: '${{ secrets.VPS_HOST }}', VPS_USER: '${{ secrets.VPS_USER }}', VPS_SSH_PORT: '${{ secrets.VPS_SSH_PORT || 22 }}' }
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/pactagent.key" -p "$VPS_SSH_PORT" -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" "$VPS_USER@$VPS_HOST" "DEPLOY_DIR=/opt/pactagent/${DEPLOYMENT_ENVIRONMENT} PACTAGENT_SERVER_IMAGE='$SERVER_REF' PACTAGENT_MIGRATE_IMAGE='$MIGRATE_REF' PACTAGENT_WEB_IMAGE='$WEB_REF' PACTAGENT_RELEASE_SHA='$RELEASE_SHA' /opt/pactagent/${DEPLOYMENT_ENVIRONMENT}/deploy-vps.sh"
      - name: Run external smoke checks
        env: { SMOKE_API_URL: '${{ vars.SMOKE_API_URL }}', SMOKE_WEB_URL: '${{ vars.SMOKE_WEB_URL }}', SMOKE_API_KEY: '${{ secrets.SMOKE_API_KEY }}', EXPECTED_COMMIT: '${{ env.RELEASE_SHA }}' }
        run: node scripts/deployment-smoke.mjs
