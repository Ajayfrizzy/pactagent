name: Deploy To VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: 22
          timeout: 2m
          command_timeout: 20m
          debug: true

          script: |
            set -e

            git config --global --add safe.directory /home/pactagent

            cd /home/pactagent

            git fetch origin
            git reset --hard origin/main

            cd server
            npm install
            npx prisma generate
            npm run build
            pm2 restart pactagent-server || pm2 start dist/index.js --name pactagent-server

            cd ../web
            npm install
            npm run build
            pm2 restart pactagent-web || pm2 start npm --name pactagent-web -- start

            pm2 save