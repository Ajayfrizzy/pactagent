name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server and migrations
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-bookworm@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
        env:
          POSTGRES_DB: pactagent_test
          POSTGRES_USER: pactagent
          POSTGRES_PASSWORD: pactagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pactagent -d pactagent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PGPASSWORD: pactagent
      DATABASE_URL: postgresql://pactagent:pactagent@127.0.0.1:5432/pactagent_test
      DIRECT_URL: postgresql://pactagent:pactagent@127.0.0.1:5432/pactagent_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma format --check
      - run: npx prisma validate
      - run: npm run db:migrate:deploy
      - run: npm run db:migrate:status
      - name: Test upgrade from the baseline migration
        timeout-minutes: 5
        run: |
          createdb -h 127.0.0.1 -U pactagent pactagent_upgrade
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U pactagent -d pactagent_upgrade -f prisma/migrations/20260715000100_baseline/migration.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U pactagent -d pactagent_upgrade -c "INSERT INTO \"App\" (id, name, slug, \"ownerUserId\", environment, status, \"defaultCurrency\", \"defaultNetwork\", \"createdAt\", \"updatedAt\") VALUES ('00000000-0000-4000-8000-000000000099', 'Upgrade Fixture', 'upgrade-fixture', 'upgrade-owner', 'sandbox', 'active', 'CKB', 'sandbox', now(), now())"
          DATABASE_URL=postgresql://pactagent:pactagent@127.0.0.1:5432/pactagent_upgrade npx prisma migrate resolve --applied 20260715000100_baseline
          DATABASE_URL=postgresql://pactagent:pactagent@127.0.0.1:5432/pactagent_upgrade npm run db:migrate:deploy
          DATABASE_URL=postgresql://pactagent:pactagent@127.0.0.1:5432/pactagent_upgrade npm run db:migrate:status
          test "$(psql -At -h 127.0.0.1 -U pactagent -d pactagent_upgrade -c "SELECT name FROM \"App\" WHERE id = '00000000-0000-4000-8000-000000000099'")" = "Upgrade Fixture"
      - run: npm test
      - run: npm run env:check --prefix ..
      - run: npm run test:integration
      - run: npm run build
      - run: npm run openapi:check
      - name: Check OpenAPI backward compatibility
        if: github.event_name == 'pull_request'
        run: |
          git show origin/${{ github.base_ref }}:server/docs/openapi/pactagent.v1.openapi.json > /tmp/pactagent-openapi-baseline.json
          npm run openapi:compat -- /tmp/pactagent-openapi-baseline.json
      - run: npm run sbom
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: server-sbom
          path: server/sbom.cdx.json
      - run: npm audit --omit=dev --audit-level=high

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  contract:
    name: CKB contract
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      # contracts/.cargo/config.toml defaults builds to RISC-V; unit tests run on the CI host.
      - run: cargo test --manifest-path Cargo.toml -p pact-escrow-lock --lib --target x86_64-unknown-linux-gnu

  containers:
    name: Container images
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - dockerfile: server/Dockerfile
            target: runtime
            tag: pactagent-server:ci
          - dockerfile: server/Dockerfile
            target: migrate
            tag: pactagent-migrate:ci
          - dockerfile: web/Dockerfile
            target: runtime
            tag: pactagent-web:ci
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: ${{ matrix.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
        with:
          image: ${{ matrix.tag }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
