[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/"]
fs_permissions = [{ access = "read", path = "./test/vectors.json" }]

[profile.default.fuzz]
runs = 512
seed = "0x4d32"

[profile.default.invariant]
runs = 128
depth = 32
fail_on_revert = false
